<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>3-Candle Screener</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      /* ── Dark theme (default) ───────────────────── */
      :root {
        --bg: #0f1117;
        --surface: #181b24;
        --surface2: #1e222d;
        --border: #2a2e3a;
        --text: #e8eaed;
        --text-muted: #9aa0ac;
        --accent: #2962ff;
        --accent-hover: #1e53e4;
        --green: #26a69a;
        --red: #ef5350;
        --amber: #ffb74d;
        --plot-bg: #181b24;
        --plot-grid: #2a2e3a;
        --plot-font: #e8eaed;
        --candle-up: #26a69a;
        --candle-down: #ef5350;
        --logo-color: #fff;
        --resize-handle: #3a3f4b;
      }

      /* ── Light theme ────────────────────────────── */
      body.light {
        --bg: #f0f2f5;
        --surface: #ffffff;
        --surface2: #f5f6f8;
        --border: #d5d8dd;
        --text: #1a1a2e;
        --text-muted: #5f6672;
        --accent: #2962ff;
        --accent-hover: #1e53e4;
        --green: #0d9f6e;
        --red: #dc3545;
        --amber: #e65100;
        --plot-bg: #ffffff;
        --plot-grid: #e0e3e8;
        --plot-font: #1a1a2e;
        --candle-up: #0d9f6e;
        --candle-down: #dc3545;
        --logo-color: #1a1a2e;
        --resize-handle: #c8ccd2;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── Top bar ─────────────────────────────────── */
      .topbar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 16px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .topbar .logo {
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.3px;
        margin-right: 12px;
        white-space: nowrap;
        color: var(--logo-color);
      }

      .topbar .logo span {
        color: var(--accent);
      }

      .ctrl-group {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .ctrl-group label {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
        margin-right: 2px;
      }

      select,
      input[type="number"] {
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 14px;
        outline: none;
      }

      select option {
        background: var(--surface);
        color: var(--text);
      }
      select:focus,
      input:focus {
        border-color: var(--accent);
      }
      input[type="number"] {
        width: 64px;
      }

      .divider {
        width: 1px;
        height: 24px;
        background: var(--border);
        margin: 0 6px;
      }

      .action-btn {
        color: #fff;
        border: none;
        border-radius: 4px;
        padding: 7px 22px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.3px;
        min-width: 80px;
      }

      .action-btn.run {
        background: var(--accent);
      }
      .action-btn.run:hover {
        background: var(--accent-hover);
      }
      .action-btn.stop {
        background: var(--red);
      }
      .action-btn.stop:hover {
        background: #c62828;
      }

      .theme-toggle {
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 5px 10px;
        font-size: 16px;
        cursor: pointer;
        line-height: 1;
        margin-left: 4px;
      }

      .theme-toggle:hover {
        border-color: var(--text-muted);
      }

      #status {
        font-size: 13px;
        color: var(--text-muted);
        margin-left: auto;
        white-space: nowrap;
      }

      #status .match-count {
        color: var(--green);
        font-weight: 600;
      }

      /* ── Main layout ─────────────────────────────── */
      .main {
        flex: 1;
        display: flex;
        min-height: 0;
      }

      /* ── Left: chart area ────────────────────────── */
      .chart-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .tabs {
        display: flex;
        gap: 2px;
        padding: 6px 12px 0;
        background: var(--surface);
        overflow-x: auto;
        flex-shrink: 0;
      }

      .tabs::-webkit-scrollbar {
        height: 3px;
      }
      .tabs::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      .tab-btn {
        background: transparent;
        color: var(--text-muted);
        border: none;
        border-bottom: 2px solid transparent;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s;
      }

      .tab-btn:hover {
        color: var(--text);
      }

      .tab-btn.active {
        color: var(--text);
        border-bottom-color: var(--accent);
        font-weight: 600;
      }

      .tab-panel {
        display: none;
        flex: 1;
        flex-direction: column;
        min-height: 0;
        overflow-y: auto;
      }

      .tab-panel.active {
        display: flex;
      }

      .chart-box {
        flex: 1;
        min-height: 350px;
      }

      .panel-header {
        display: flex;
        justify-content: flex-end;
        padding: 4px 8px;
        flex-shrink: 0;
      }

      .btn-fullscreen {
        background: var(--surface2);
        color: var(--text-muted);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 4px 12px;
        font-size: 13px;
        cursor: pointer;
      }

      .btn-fullscreen:hover {
        color: var(--text);
        border-color: var(--text-muted);
      }

      /* ── Resizable wrapper for tables ────────────── */
      .resizable-wrap {
        overflow: auto;
        resize: vertical;
        flex-shrink: 0;
        border-top: 3px solid var(--resize-handle);
        position: relative;
        cursor: default;
      }

      .resizable-wrap::after {
        content: "\u2502\u2502\u2502";
        position: absolute;
        top: -2px;
        left: 50%;
        transform: translateX(-50%) rotate(90deg);
        font-size: 8px;
        color: var(--text-muted);
        pointer-events: none;
        letter-spacing: 1px;
      }

      .resizable-wrap::-webkit-scrollbar {
        width: 5px;
      }
      .resizable-wrap::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      /* ── Candle detail table ─────────────────────── */
      .candle-detail-wrap {
        min-height: 60px;
        max-height: 50vh;
        height: 140px;
      }

      .candle-detail-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      .candle-detail-table th {
        background: var(--surface2);
        color: var(--text-muted);
        padding: 6px 10px;
        border: 1px solid var(--border);
        text-align: center;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.4px;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      .candle-detail-table td {
        padding: 5px 10px;
        border: 1px solid var(--border);
        text-align: center;
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      .candle-detail-table tr.c1-row td {
        background: rgba(255, 183, 77, 0.1);
      }
      .candle-detail-table tr.c2-row td {
        background: rgba(38, 166, 154, 0.1);
      }
      .candle-detail-table tr.c3-row td {
        background: rgba(41, 98, 255, 0.1);
      }

      /* ── Results table (below tabs) ──────────────── */
      .results-wrap {
        min-height: 60px;
        max-height: 50vh;
        height: 160px;
      }

      #table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      #table th {
        background: var(--surface2);
        color: var(--text-muted);
        padding: 7px 12px;
        border: 1px solid var(--border);
        text-align: left;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.4px;
        position: sticky;
        top: 0;
        z-index: 1;
      }

      #table td {
        padding: 6px 12px;
        border: 1px solid var(--border);
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      .ok {
        color: var(--green);
        font-weight: 600;
      }

      /* ── Right sidebar: history ───────────────────── */
      .sidebar {
        width: 280px;
        background: var(--surface);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        transition: width 0.2s;
      }

      .sidebar.collapsed {
        width: 36px;
      }
      .sidebar.collapsed .sidebar-content {
        display: none;
      }
      .sidebar.collapsed .sidebar-header span {
        display: none;
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 10px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }

      .sidebar-header span {
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--text-muted);
      }

      .sidebar-toggle {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 16px;
        padding: 2px 4px;
      }

      .sidebar-toggle:hover {
        color: var(--text);
      }
      .sidebar-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 16px;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .sidebar-btn:hover {
        color: var(--text);
        background: var(--surface2);
      }
      .delete-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 13px;
        padding: 1px 4px;
        border-radius: 3px;
        opacity: 0.5;
      }
      .delete-btn:hover {
        color: var(--red);
        opacity: 1;
      }
      #historyTable .ephemeral td {
        opacity: 0.6;
        font-style: italic;
      }

      .sidebar-content {
        flex: 1;
        overflow-y: auto;
      }

      .sidebar-content::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar-content::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
      }

      #historyTable,
      #stockListTable {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      #historyTable th,
      #stockListTable th {
        background: var(--surface2);
        color: var(--text-muted);
        padding: 6px 8px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        font-weight: 600;
        font-size: 12px;
        position: sticky;
        top: 0;
      }

      #historyTable td,
      #stockListTable td {
        padding: 6px 8px;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        cursor: pointer;
      }

      #historyTable tbody tr:hover td,
      #stockListTable tbody tr:hover td {
        background: var(--surface2);
      }
      #historyTable tbody tr.active-row td,
      #stockListTable tbody tr.active-row td {
        background: var(--accent);
        color: #fff;
      }

      /* ── Fullscreen overlay ──────────────────────── */
      #fullscreen-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: var(--bg);
        z-index: 9999;
        padding: 12px;
        box-sizing: border-box;
      }

      #fullscreen-overlay.active {
        display: flex;
        flex-direction: column;
      }
      #fullscreen-chart {
        flex: 1;
        width: 100%;
      }

      #fullscreen-close {
        align-self: flex-end;
        margin-bottom: 8px;
        padding: 6px 16px;
        font-size: 14px;
        cursor: pointer;
        background: var(--surface2);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
      }

      #fullscreen-close:hover {
        border-color: var(--text-muted);
      }

      /* ── Center status / empty state ─────────────── */
      .center-msg {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        font-size: 16px;
        flex-direction: column;
        gap: 10px;
      }

      .center-msg .icon {
        font-size: 36px;
        opacity: 0.35;
      }

      .center-msg .scan-round {
        font-size: 28px;
        font-weight: 700;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
      }

      .center-msg .scan-detail {
        font-size: 14px;
        color: var(--text-muted);
        text-align: center;
        line-height: 1.6;
      }

      .center-msg .last-result {
        font-size: 13px;
        color: var(--text);
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 20px;
        text-align: center;
        margin-top: 4px;
      }

      .center-msg .last-result .count {
        color: var(--green);
        font-weight: 700;
        font-size: 18px;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }

      .scanning-pulse {
        animation: pulse 1.5s ease-in-out infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .history-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        flex: 1;
        color: var(--text-muted);
        font-size: 14px;
      }
      .history-loader .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .history-row-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 20px 8px;
        color: var(--text-muted);
        font-size: 13px;
      }
      .history-row-loader .mini-spinner {
        width: 14px;
        height: 14px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #historyTable tbody tr.history-loading-row td {
        border-bottom: none;
        cursor: default;
        background: transparent !important;
      }

      /* ── Progress bar ────────────────────────────── */
      .progress-wrap {
        height: 3px;
        background: var(--border);
        flex-shrink: 0;
      }

      .progress-bar {
        height: 100%;
        background: var(--accent);
        width: 0%;
        transition: width 0.3s;
      }

      @keyframes indeterminate {
        0% {
          left: -30%;
          width: 30%;
        }
        100% {
          left: 100%;
          width: 30%;
        }
      }

      .progress-bar.indeterminate {
        position: relative;
        width: 100%;
        background: transparent;
      }

      .progress-bar.indeterminate::after {
        content: "";
        position: absolute;
        top: 0;
        left: -30%;
        height: 100%;
        width: 30%;
        background: var(--accent);
        animation: indeterminate 1.2s linear infinite;
      }
    </style>
  </head>
  <body>
    <!-- Fullscreen overlay -->
    <div id="fullscreen-overlay">
      <button id="fullscreen-close" onclick="closeFullscreen()">Close</button>
      <div id="fullscreen-chart"></div>
    </div>

    <!-- Top bar -->
    <div class="topbar">
      <div class="logo"><span>3C</span> Screener</div>

      <div class="ctrl-group">
        <label>Preset</label>
        <select id="preset">
          <option value="today">Today</option>
          <option value="1h">1H</option>
          <option value="2h">2H</option>
          <option value="4h">4H</option>
          <option value="2d">2D</option>
          <option value="1w">1W</option>
          <option value="1mo">1M</option>
          <option value="3mo">3M</option>
          <option value="6mo">6M</option>
          <option value="1y">1Y</option>
        </select>
      </div>

      <div class="ctrl-group">
        <label>TF</label>
        <select id="timeframe">
          <option value="1m">1m</option>
          <option value="5m" selected>5m</option>
          <option value="15m">15m</option>
          <option value="30m">30m</option>
          <option value="1h">1h</option>
          <option value="1d">1d</option>
          <option value="1w">1w</option>
          <option value="1mo">1mo</option>
        </select>
      </div>

      <div class="divider"></div>

      <div class="ctrl-group">
        <label>Indicator</label>
        <select id="indicator" onchange="onIndicatorChange()">
          <option value="SMA">SMA</option>
          <option value="VWAP" selected>VWAP</option>
          <option value="EMA">EMA</option>
          <option value="CLOSE">CLOSE</option>
          <option value="BOLLINGER_BAND">BB Mid</option>
          <option value="BOLLINGER_UPPER">BB Upper</option>
          <option value="BOLLINGER_LOWER">BB Lower</option>
        </select>
      </div>

      <div class="ctrl-group">
        <label>Win</label>
        <input id="window" type="number" min="2" max="200" value="20" />
      </div>

      <div class="ctrl-group" id="stdDevContainer" style="display: none">
        <label>&sigma;</label>
        <input id="stdDev" type="number" min="0.1" max="5" step="0.1" value="2" />
      </div>

      <div class="divider"></div>

      <div class="ctrl-group">
        <label>C1 Side</label>
        <select id="candle1Side">
          <option value="BELOW" selected>Below</option>
          <option value="ABOVE">Above</option>
        </select>
      </div>

      <div class="ctrl-group">
        <label>Breakout</label>
        <select id="breakoutMode">
          <option value="CLOSE" selected>Close</option>
          <option value="HIGH">High</option>
        </select>
      </div>

      <button class="action-btn run" id="actionBtn">Run</button>

      <div id="status"></div>

      <a
        href="/watchlist.html"
        target="_blank"
        rel="noopener"
        class="theme-toggle"
        id="watchlistLink"
        title="Open watchlist in new tab"
        style="text-decoration: none; font-size: 13px; padding: 6px 12px"
        >Watchlist</a
      >
      <button class="theme-toggle" id="themeToggle" title="Toggle light / dark mode">&#9789;</button>
    </div>

    <!-- Progress -->
    <div class="progress-wrap"><div class="progress-bar" id="progress"></div></div>

    <!-- Main layout -->
    <div class="main">
      <!-- Chart area -->
      <div class="chart-area">
        <div id="tab-panels" style="flex: 1; display: flex; flex-direction: column; min-height: 0">
          <!-- Center message area (idle / scanning / chart) -->
          <div class="center-msg" id="centerMsg">
            <div class="icon">&#9680;</div>
            <div>Run the screener to find 3-candle breakout patterns</div>
            <div style="font-size: 13px">~500 stocks scanned per round</div>
          </div>
        </div>

        <!-- Results table -->
        <div class="resizable-wrap results-wrap" id="resultsWrap" style="display: none">
          <table id="table">
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Exchange</th>
                <th>C2 High</th>
                <th>C3 Time</th>
                <th>LTP</th>
                <th>Live Break</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <!-- Right sidebar: history -->
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <button class="sidebar-btn" id="backToHistory" title="Back to history" style="display: none">&#8592;</button>
          <span id="sidebarTitle">History</span>
          <div style="display: flex; gap: 4px; align-items: center">
            <button class="sidebar-btn" id="refreshHistory" title="Refresh (clear ephemeral)">&#8635;</button>
            <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">&#9776;</button>
          </div>
        </div>
        <div class="sidebar-content">
          <table id="historyTable">
            <thead>
              <tr>
                <th>Time</th>
                <th>TF</th>
                <th>Ind</th>
                <th>Hits</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <table id="stockListTable" style="display: none">
            <thead>
              <tr>
                <th>Symbol</th>
                <th>LTP</th>
                <th>Break</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      console.log("ver 0.0.4");
      const $ = (id) => document.getElementById(id);

      let serverIndicator = "SMA";
      let lastRows = [];
      let isDark = true;
      let currentStock = null; // stock currently shown in the center chart
      let viewingChart = false; // true while a history scan's charts are being viewed

      // ── Scanning state ──
      let scanning = false;
      let scanRound = 0;
      let totalMatches = 0;
      let abortController = null;
      let ephemeralHistory = []; // 0-match entries, not saved to server

      function isBollingerIndicator(val) {
        return ["BOLLINGER_BAND", "BOLLINGER_UPPER", "BOLLINGER_LOWER"].includes(val);
      }

      function onIndicatorChange() {
        $("stdDevContainer").style.display = isBollingerIndicator($("indicator").value) ? "" : "none";
      }

      onIndicatorChange();

      // ── Theme toggle ──
      $("themeToggle").addEventListener("click", () => {
        isDark = !isDark;
        document.body.classList.toggle("light", !isDark);
        $("themeToggle").innerHTML = isDark ? "&#9789;" : "&#9788;";
        localStorage.setItem("theme", isDark ? "dark" : "light");

      });

      // ── Plotly theme ──

        return {
          paper_bgcolor: "rgba(0,0,0,0)",

      // Sidebar toggle
      $("sidebarToggle").addEventListener("click", () => {

      function fmtTime(t) {
        const n = typeof t === "string" && /^\d+$/.test(t) ? Number(t) : t;
        return new Date(n).toLocaleString();
      }

      function parseIST(ts) {
        if (typeof ts === "string" && /^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}/.test(ts)) {
          return new Date(ts.replace(" ", "T") + ":00+05:30");
        }
        return new Date(ts);
      }

      function formatUTC(ts) {
        const d = new Date(ts);
        const pad = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      // Angel One getCandleData per-call day limits, by interval
      const TF_MAX_DAYS = {
        "1m": 30,
        "3m": 60,
        "5m": 100,
        "10m": 100,
        "15m": 200,
        "30m": 200,
        "1h": 400,
        "1d": 2000,
      };
      const PRESET_DAYS = {
        today: 1,
        "1h": 1,
        "2h": 1,
        "4h": 1,
        "2d": 2,
        "1w": 7,
        "1mo": 30,
        "3mo": 90,
        "6mo": 180,
        "1y": 365,
      };
      // Angel One getCandleData rate limits
      const RATE_LIMIT = { perSec: 3, perMin: 180, perHour: 5000 };
      // Matches DEFAULT_STOCKS in server.js — keep in sync if that list changes.
      const STOCKS_PER_ROUND = 500;

      function checkApiLimit(preset, timeframe) {
        // 1w/1mo timeframes always aggregate from daily candles server-side, so skip.
        if (timeframe === "1w" || timeframe === "1mo") return null;
        const need = PRESET_DAYS[preset] ?? 1;
        const max = TF_MAX_DAYS[timeframe] ?? 30;
        if (need > max) {
          return `Preset "${preset}" requests ~${need} days of data, but Angel One allows only ~${max} days per call for ${timeframe} candles. The request will likely fail.`;
        }
        return null;
      }

      function getRateLimitNotice(stocksPerRound) {
        const calls = stocksPerRound;
        const minSecPerRound = Math.ceil(calls / RATE_LIMIT.perSec);
        const maxRoundsPerMin = Math.max(1, Math.floor(RATE_LIMIT.perMin / calls));
        const maxRoundsPerHour = Math.floor(RATE_LIMIT.perHour / calls);
        return (
          `Rate limits (getCandleData: ${RATE_LIMIT.perSec}/sec, ${RATE_LIMIT.perMin}/min, ${RATE_LIMIT.perHour}/hour):\n` +
          `  • ~${calls} candle calls per round\n` +
          `  • ≥${minSecPerRound}s per round (per-second cap)\n` +
          `  • max ~${maxRoundsPerMin} round/min, ~${maxRoundsPerHour} rounds/hour before throttling`
        );
      }

      // Once per session per (preset, timeframe) — avoids nagging on every Run.
      const ackedRateNotice = new Set();

      // ── Action button: Run / Stop ──
      $("actionBtn").addEventListener("click", () => {
        if (scanning) {
          stopScanning();
          return;
        }
        const preset = $("preset").value;
        const timeframe = $("timeframe").value;
        const capWarn = checkApiLimit(preset, timeframe);
        const ackKey = `${preset}|${timeframe}`;
        const needAck = capWarn || !ackedRateNotice.has(ackKey);
        if (needAck) {
          const msg = (capWarn ? `WARNING: ${capWarn}\n\n` : "") + getRateLimitNotice(STOCKS_PER_ROUND) + `\n\nStart scanning?`;
          if (!confirm(msg)) return;
          ackedRateNotice.add(ackKey);
        }
        startScanning();
      });

      function startScanning() {
        scanning = true;
        scanRound = 0;
        totalMatches = 0;
        $("actionBtn").textContent = "Stop";
        $("actionBtn").className = "action-btn stop";

        // Clear charts — they only appear on history click now
        viewingChart = false;
        currentStock = null;
        showHistoryView();
        $("tab-panels").innerHTML = "";
        $("resultsWrap").style.display = "none";
        document.querySelector("#table tbody").innerHTML = "";

        showScanningCenter("Starting...", "Preparing to scan stocks...", true);
        scanLoop();
      }

      function stopScanning() {
        scanning = false;
        if (abortController) {
          abortController.abort();
          abortController = null;
        }
        $("actionBtn").textContent = "Run";
        $("actionBtn").className = "action-btn run";
        $("progress").className = "progress-bar";
        $("progress").style.width = "0%";
        $("status").innerHTML = `Stopped after <span class="match-count">${scanRound}</span> rounds | Total matches: <span class="match-count">${totalMatches}</span>`;
      }

      function showScanningCenter(message, detail, pulsing) {
        // Only update center if no chart is being viewed
        if (viewingChart) return;

        const cm = $("centerMsg") || document.createElement("div");
        cm.id = "centerMsg";
        cm.className = "center-msg";

        const pulseClass = pulsing ? "scanning-pulse" : "";
        cm.innerHTML = `
        <div class="icon ${pulseClass}">&#9881;</div>
        <div class="scan-round">${message}</div>
        <div class="scan-detail">${detail}</div>
      `;

        if (!$("centerMsg")) {
          $("tab-panels").prepend(cm);
        }
      }

      // Run one scan round using SSE stream from server
      function runScanRound(payload) {
        return new Promise((resolve, reject) => {
          abortController = new AbortController();
          const signal = abortController.signal;

          // Clamp progress to never go backward within a round — 3 concurrent
          // workers can emit out-of-order intermediate values.
          let lastCurrent = 0;

          fetch("/api/screener", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
            signal,
          })
            .then(async (resp) => {
              const reader = resp.body.getReader();
              const decoder = new TextDecoder();
              let buffer = "";
              let finalResult = null;

              while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split("\n");
                buffer = lines.pop(); // keep incomplete line

                for (const line of lines) {
                  if (!line.startsWith("data: ")) continue;
                  try {
                    const evt = JSON.parse(line.slice(6));
                    if (evt.type === "progress") {
                      lastCurrent = Math.max(lastCurrent, evt.current || 0);
                      const cur = lastCurrent;
                      const pct = evt.total ? Math.round((cur / evt.total) * 100) : 0;
                      $("progress").className = "progress-bar";
                      $("progress").style.width = pct + "%";

                      const stepLabel =
                        {
                          init: "Initializing...",
                          fetch: `Fetching candles: ${evt.message}`,
                          calculate: `Analyzing pattern: ${evt.message}`,
                          ltp: "Fetching live prices...",
                          saving: "Saving results to history...",
                        }[evt.step] || evt.message;

                      $("status").innerHTML =
                        `<span style="color:var(--amber)">Round ${scanRound + 1}</span> | ${stepLabel} <span class="match-count">(${cur}/${evt.total || 0})</span> | Matches: <span class="match-count">${evt.matches || 0}</span>`;

                      showScanningCenter(`Round ${scanRound + 1} — ${cur}/${evt.total || 0}`, `${stepLabel}<br>Matches so far: <strong>${evt.matches || 0}</strong>`, true);
                    } else if (evt.type === "match") {
                      lastCurrent = Math.max(lastCurrent, evt.current || 0);
                      const cur = lastCurrent;
                      // Flash match notification
                      showScanningCenter(
                        `Round ${scanRound + 1} — ${cur}/${evt.total}`,
                        `Pattern found in <strong style="color:var(--green)">${evt.symbol}</strong><br>Total matches: <strong>${evt.matches}</strong>`,
                        true,
                      );
                    } else if (evt.type === "done") {
                      finalResult = evt;
                    } else if (evt.type === "error") {
                      throw new Error(evt.message);
                    }
                  } catch (parseErr) {
                    if (parseErr.message && !parseErr.message.includes("JSON")) throw parseErr;
                  }
                }
              }

              abortController = null;
              if (finalResult) {
                resolve(finalResult);
              } else {
                reject(new Error("Stream ended without result"));
              }
            })
            .catch(reject);
        });
      }

      async function scanLoop() {
        while (scanning) {
          const selectedIndicator = $("indicator").value;
          serverIndicator = selectedIndicator;
          const stdDev = parseFloat($("stdDev").value) || 2;

          const payload = {
            preset: $("preset").value,
            timeframe: $("timeframe").value,
            indicator: selectedIndicator,
            window: Number($("window").value),
            stdDev,
            candle1Side: $("candle1Side").value,
            breakoutMode: $("breakoutMode").value,
            confirmWithLTP: true,
          };

          $("progress").className = "progress-bar";
          $("progress").style.width = "0%";
          showScanningCenter(`Round ${scanRound + 1}`, "Sending request...", true);

          try {
            const result = await runScanRound(payload);

            if (!scanning) break;

            const rows = result.results || [];
            scanRound++;
            totalMatches += rows.length;

            // If 0 matches, add as ephemeral (not saved on server)
            if (rows.length === 0) {
              ephemeralHistory.unshift({
                id: `ephemeral-${Date.now()}`,
                ephemeral: true,
                ts: new Date().toISOString(),
                params: result.params || payload,
                results: [],
              });
            }

            const now = formatUTC(new Date().toISOString());
            $("status").innerHTML =
              `Round <span class="match-count">${scanRound}</span> done | Last: <span class="match-count">${rows.length}</span> matches | Total: <span class="match-count">${totalMatches}</span>`;

            showScanningCenter(
              scanning ? `Round ${scanRound} complete` : `Completed ${scanRound} rounds`,
              `Last scan: <span class="count">${rows.length}</span> matches at ${now}<br>Total matches: <strong>${totalMatches}</strong>${scanning ? "<br>Starting next round..." : "<br>Click a history entry to view charts"}`,
              scanning,
            );

            await fetchHistoryAndRender();
          } catch (e) {
            if (e.name === "AbortError" || !scanning) break;
            $("status").innerHTML = `<span style="color:var(--red)">Round ${scanRound + 1} error: ${e.message || e}</span>`;
            showScanningCenter(`Round ${scanRound + 1} — Error`, `<span style="color:var(--red)">${e.message || e}</span><br>Retrying in 3s...`, false);
            await new Promise((r) => setTimeout(r, 3000));
          }

          // Brief pause between rounds
          if (scanning) {
            await new Promise((r) => setTimeout(r, 1000));
          }
        }

        // Clean up after loop exits
        $("progress").className = "progress-bar";
        $("progress").style.width = "0%";
      }

      // ── Bollinger Bands (client-side for chart) ──
      function calculateBollingerBands(candles, window = 20, numDev = 2) {
        const closes = candles.map((c) => c.close);
        const upperBand = [],
          lowerBand = [],
          middleBand = [];

        // Use a partial window for the first window-1 candles so the bands
        // span the full chart (no leading gap before the warm-up completes).
        for (let i = 0; i < closes.length; i++) {
          const start = Math.max(0, i - window + 1);
          const slice = closes.slice(start, i + 1);
          const sma = slice.reduce((s, v) => s + v, 0) / slice.length;
          const variance = slice.reduce((s, v) => s + Math.pow(v - sma, 2), 0) / slice.length;
          const sd = Math.sqrt(variance);
          upperBand.push(sma + numDev * sd);
          lowerBand.push(sma - numDev * sd);
          middleBand.push(sma);
        }

        return { upperBand, lowerBand, middleBand };
      }

      // Fill the bottom results table with every matched stock for the scan.
      function renderResultsTable(rows) {
        lastRows = rows;
        const tbody = document.querySelector("#table tbody");

        for (const r of rows) {

      // Render a single stock's chart + candle-detail table in the center.
      function renderStockChart(r) {
        currentStock = r;
        viewingChart = true;
        $("centerMsg")?.remove();
        $("tab-panels").innerHTML = "";

        const plotlyBase = getPlotlyLayout();
        const cc = getCandleColors();

        const candles = r.candles;
        if (!candles || !candles.length) {
          $("tab-panels").innerHTML = `<div class="center-msg"><div class="icon">&#9675;</div><div>No chart data for ${r.tradingsymbol}</div></div>`;
          return;
        }

        const dates = candles.map((c) => parseIST(c.time));
        const opens = candles.map((c) => c.open);
        const highs = candles.map((c) => c.high);
        const lows = candles.map((c) => c.low);
        const closes = candles.map((c) => c.close);
        const indicatorValues = candles.map((c) => c.indicator);

        const bollingerWindow = Number($("window").value) || 20;
        const bollingerStdDev = parseFloat($("stdDev").value) || 2;
        const { upperBand, lowerBand, middleBand } = calculateBollingerBands(candles, bollingerWindow, bollingerStdDev);
        const chosenIndicator = $("indicator").value;
        // Bands now span every candle (partial window for the warm-up), so use the full dates array.
        const bollingerDates = dates;

        const panel = document.createElement("div");
        panel.className = "tab-panel active";

        const panelHeader = document.createElement("div");
        panelHeader.className = "panel-header";
        const fsBtn = document.createElement("button");
        fsBtn.className = "btn-fullscreen";
        fsBtn.textContent = "Fullscreen";
        panelHeader.appendChild(fsBtn);
        panel.appendChild(panelHeader);

        const chartDiv = document.createElement("div");
        chartDiv.className = "chart-box";
        const chartId = `chart-${r.exchange}-${r.tradingsymbol}`.replace(/[^a-zA-Z0-9-_]/g, "");
        chartDiv.id = chartId;
        panel.appendChild(chartDiv);

        const allHits = r.hits && r.hits.length ? r.hits : r.hit ? [r.hit] : [];

        function fmtN(v) {
          return Number.isFinite(v) ? v.toFixed(2) : "\u2014";
        }
        function fmtT(t) {
          return t ? formatUTC(t) : "\u2014";
        }

        const candleWrap = document.createElement("div");
        candleWrap.className = "resizable-wrap candle-detail-wrap";

        const candleTable = document.createElement("table");
        candleTable.className = "candle-detail-table";
        let html = `<thead><tr>`;
        if (allHits.length > 1) html += `<th>Hit</th>`;
        html += `<th>Candle</th><th>Time</th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>Vol</th><th>Indicator</th></tr></thead><tbody>`;

        allHits.forEach((hit, hi) => {
          const c1 = hit.candle1Index != null ? candles[hit.candle1Index] : null;
          const c2 = hit.candle2Index != null ? candles[hit.candle2Index] : null;
          const c3 = hit.candle3Index != null ? candles[hit.candle3Index] : null;
          const hitCol = allHits.length > 1 ? `<td>#${hi + 1}</td>` : "";
          html += `
            <tr class="c1-row">${hitCol}<td>C1</td><td>${fmtT(c1?.time)}</td><td>${fmtN(c1?.open)}</td><td>${fmtN(c1?.high)}</td><td>${fmtN(c1?.low)}</td><td>${fmtN(c1?.close)}</td><td>${c1?.volume ?? "\u2014"}</td><td>${fmtN(c1?.indicator)}</td></tr>
            <tr class="c2-row">${hitCol}<td>C2</td><td>${fmtT(c2?.time)}</td><td>${fmtN(c2?.open)}</td><td>${fmtN(c2?.high)}</td><td>${fmtN(c2?.low)}</td><td>${fmtN(c2?.close)}</td><td>${c2?.volume ?? "\u2014"}</td><td>${fmtN(c2?.indicator)}</td></tr>
            <tr class="c3-row">${hitCol}<td>C3</td><td>${fmtT(c3?.time)}</td><td>${fmtN(c3?.open)}</td><td>${fmtN(c3?.high)}</td><td>${fmtN(c3?.low)}</td><td>${fmtN(c3?.close)}</td><td>${c3?.volume ?? "\u2014"}</td><td>${fmtN(c3?.indicator)}</td></tr>
          `;
        });
        html += `</tbody>`;
        candleTable.innerHTML = html;
        candleWrap.appendChild(candleTable);
        panel.appendChild(candleWrap);

        $("tab-panels").appendChild(panel);

        const isBollinger = isBollingerIndicator(chosenIndicator);
        const indLabel = chosenIndicator.replace(/_/g, " ");

        const data = [
          {
            x: dates,
            open: opens,
            high: highs,
            low: lows,
            close: closes,
            type: "candlestick",
            name: r.tradingsymbol.replace("-EQ", ""),
            increasing: { line: { color: cc.up } },
            decreasing: { line: { color: cc.down } },
          },
        ];

        if (!isBollinger) {
          data.push({
            x: dates,
            y: indicatorValues,
            type: "scatter",
            mode: "lines",
            name: `${indLabel} (${$("window").value})`,
            line: { width: 1.5, color: "#ff9800" },
          });
        }

        if (isBollinger) {
          const activeU = chosenIndicator === "BOLLINGER_UPPER";
          const activeL = chosenIndicator === "BOLLINGER_LOWER";
          const activeM = chosenIndicator === "BOLLINGER_BAND";
          data.push({
            x: bollingerDates,
            y: upperBand,
            type: "scatter",
            mode: "lines",
            name: `Upper (\u03c3\u00d7${bollingerStdDev})`,
            line: { width: activeU ? 2.5 : 1, color: cc.up, dash: activeU ? "solid" : "dash" },
          });
          data.push({
            x: bollingerDates,
            y: lowerBand,
            type: "scatter",
            mode: "lines",
            name: `Lower (\u03c3\u00d7${bollingerStdDev})`,
            line: { width: activeL ? 2.5 : 1, color: cc.down, dash: activeL ? "solid" : "dash" },
          });
          data.push({
            x: bollingerDates,
            y: middleBand,
            type: "scatter",
            mode: "lines",
            name: "Middle (SMA)",
            line: { width: activeM ? 2.5 : 1.2, color: "#42a5f5", dash: activeM ? "solid" : "dot" },
          });
        }

        const markerTypes = [
          { key: "candle1Index", label: "C1", color: "#ffb74d", symbol: "triangle-up" },
          { key: "candle2Index", label: "C2", color: "#26a69a", symbol: "circle" },
          { key: "candle3Index", label: "C3", color: "#42a5f5", symbol: "star" },
        ];
        const multiHit = allHits.length > 1;
        // Hit colors for distinguishing multiple hits
        const hitColors = ["#ffb74d", "#26a69a", "#42a5f5", "#ef5350", "#ab47bc", "#ffa726", "#66bb6a", "#ec407a", "#29b6f6", "#8d6e63"];

        allHits.forEach((hit, hi) => {
          const groupName = multiHit ? `Hit ${hi + 1}` : "Pattern";
          const groupColor = multiHit ? hitColors[hi % hitColors.length] : null;

          for (const { key, label, color: defaultColor, symbol } of markerTypes) {
            const idx = hit[key];
            const candle = idx != null ? candles[idx] : null;
            if (!candle || idx == null) continue;
            const mLabel = multiHit ? `${label}-${hi + 1}` : label;
            const mColor = multiHit ? groupColor : defaultColor;
            data.push({
              x: [dates[idx]],
              y: [candle.high * 1.002],
              type: "scatter",
              mode: "markers+text",
              name: mLabel,
              text: [mLabel],
              textposition: "top center",
              marker: { symbol, size: 12, color: mColor },
              textfont: { size: 12, color: mColor, family: "sans-serif" },
              legendgroup: groupName,
              legendgrouptitle: { text: groupName, font: { size: 11 } },
            });
          }
        });

        const hitCountLabel = allHits.length > 1 ? ` (${allHits.length} hits)` : "";
        const layout = Object.assign({}, plotlyBase, {
          title: { text: `${r.tradingsymbol.replace("-EQ", "")} \u2013 ${indLabel}${hitCountLabel}`, font: { size: 15 } },
          xaxis: { ...plotlyBase.xaxis },
          yaxis: { ...plotlyBase.yaxis },
          legend: { ...(plotlyBase.legend || {}), groupclick: "togglegroup" },
        });

        Plotly.purge(chartId);
        Plotly.newPlot(chartId, data, layout, { responsive: true });

        fsBtn.addEventListener("click", () => openFullscreen(chartId, data, layout));
      }

      // ── History ──
      async function fetchHistoryAndRender() {
        const tbody = document.querySelector("#historyTable tbody");
        tbody.innerHTML = `
          <tr class="history-loading-row">
            <td colspan="5">
              <div class="history-row-loader">
                <div class="mini-spinner"></div>
                <span>Loading history…</span>
              </div>
            </td>
          </tr>`;

        let json;
        try {
          const resp = await fetch("/api/history");
          json = await resp.json();
        } catch (e) {
          tbody.innerHTML = `<tr class="history-loading-row"><td colspan="5" style="text-align:center;padding:16px;color:var(--red)">Failed to load history</td></tr>`;
          return;
        }
        if (!json.ok) {
          tbody.innerHTML = `<tr class="history-loading-row"><td colspan="5" style="text-align:center;padding:16px;color:var(--red)">Failed to load history</td></tr>`;
          return;
        }

        const serverHistory = json.history || [];
        // Merge ephemeral (0-match) entries with server history, sorted newest first
        const allHistory = [...ephemeralHistory, ...serverHistory].sort((a, b) => new Date(b.ts) - new Date(a.ts));

        tbody.innerHTML = "";

        allHistory.forEach((h) => {
          const tr = document.createElement("tr");
          tr.dataset.id = h.id;
          if (h.ephemeral) tr.className = "ephemeral";
          const ts = formatUTC(h.ts);
          const matches = Array.isArray(h.results) ? h.results.length : 0;

          tr.innerHTML = `
          <td>${ts}</td>
          <td>${h.params?.timeframe ?? ""}</td>
          <td>${h.params?.indicator ?? ""}</td>
          <td>${matches}</td>
          <td><button class="delete-btn" title="Delete">&times;</button></td>
        `;

          // Delete button
          tr.querySelector(".delete-btn").addEventListener("click", async (e) => {
            e.stopPropagation();
            if (h.ephemeral) {
              ephemeralHistory = ephemeralHistory.filter((x) => x.id !== h.id);
            } else {
              await fetch("/api/history/" + h.id, { method: "DELETE" });
            }
            await fetchHistoryAndRender();
          });

          // Row click to view
          tr.addEventListener("click", async () => {
            document.querySelectorAll("#historyTable tbody tr").forEach((r) => r.classList.remove("active-row"));
            tr.classList.add("active-row");

            if (h.ephemeral || String(h.id).startsWith("dummy-")) {
              renderFromHistoryItem(h);
              return;
            }
            showHistoryLoader();
            try {
              const r = await fetch("/api/history/" + h.id);
              const j = await r.json();
              if (j.ok) renderFromHistoryItem(j.item);
            } catch (e) {
              $("tab-panels").innerHTML = `<div class="center-msg"><div class="icon">⚠</div><div>Failed to load: ${e.message || e}</div></div>`;
            }
          });

          tbody.appendChild(tr);
        });
      }

      // Refresh button — clears ephemeral entries and reloads
      $("refreshHistory").addEventListener("click", () => {
        ephemeralHistory = [];
        fetchHistoryAndRender();
      });

      function renderFromHistoryItem(item) {
        const results = item.results || [];
        if (item.params?.preset) $("preset").value = item.params.preset;
        if (item.params?.timeframe) $("timeframe").value = item.params.timeframe;
        if (item.params?.indicator) {
          const uiInd = $("indicator").value;
          if (!isBollingerIndicator(uiInd)) $("indicator").value = item.params.indicator;
        }
        if (Number.isFinite(item.params?.window)) $("window").value = item.params.window;
        if (item.params?.candle1Side) $("candle1Side").value = item.params.candle1Side;
        if (item.params?.breakoutMode) $("breakoutMode").value = item.params.breakoutMode;

        $("status").innerHTML = `History: ${formatUTC(item.ts)} | Matches: <span class="match-count">${results.length}</span>`;

        if (results.length) {
          renderResultsTable(results);
          showStockList(item); // swaps the sidebar to the stock list and shows the first chart
        } else {
          // No matches — keep the history list, show a message in the center.
          showHistoryView();
          $("tab-panels").innerHTML = `<div class="center-msg" id="centerMsg"><div class="icon">&#9675;</div><div>No matches in this scan</div></div>`;
          $("resultsWrap").style.display = "none";
          document.querySelector("#table tbody").innerHTML = "";
        }
      }

      fetchHistoryAndRender();

      function openFullscreen(chartId, data, layout) {
        $("fullscreen-overlay").classList.add("active");
        Plotly.purge($("fullscreen-chart"));
        const fsLayout = Object.assign({}, layout, { height: window.innerHeight - 80 });
        Plotly.newPlot($("fullscreen-chart"), data, fsLayout, { responsive: true });
      }

      function closeFullscreen() {
        $("fullscreen-overlay").classList.remove("active");
        Plotly.purge($("fullscreen-chart"));
      }
    </script>
  </body>
</html>
